services:
  - type: web
    name: purplebee-staging
    runtime: node
    branch: staging
    buildCommand: npm ci && npm run build
    startCommand: node server.js
    envVars:
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
      - key: NODE_ENV
        value: production
